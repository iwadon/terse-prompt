---
name: Build

on:
  push:
    branches: [master]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
  pull_request:
    branches: [master]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Ubuntu (Ninja)
            os: ubuntu-latest
            generator: Ninja
            build_flag: ""
            test_flag: ""
          - name: macOS (Ninja)
            os: macos-latest
            generator: Ninja
            build_flag: ""
            test_flag: ""
          - name: Windows (MSVC)
            os: windows-latest
            generator: ""
            build_flag: "--config Release"
            test_flag: "-C Release"

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          submodules: false
          persist-credentials: false

      - name: Install Ninja (Ubuntu)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Install Ninja (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja

      - name: Configure CMake
        run: >-
          cmake -S . -B build
          ${{ matrix.generator && format('-G "{0}"', matrix.generator) || '' }}
          -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build ${{ matrix.build_flag }}

      - name: Test
        run: ctest --test-dir build --output-on-failure ${{ matrix.test_flag }}
