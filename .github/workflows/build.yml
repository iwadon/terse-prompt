---
name: Build

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          submodules: false
          fetch-depth: 0

      - name: Set up Python and dependencies
        run: |
          python -m pip install --upgrade pip
          pip install PyJWT requests

      - name: Get GitHub App installation token
        id: get_token
        env:
          APP_ID: ${{ secrets.APP_ID }}
          APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
        run: |
          python .github/scripts/get_installation_token.py > /tmp/install_token.txt
          echo "INSTALL_TOKEN=$(cat /tmp/install_token.txt)" >> $GITHUB_ENV

      - name: Configure git credentials for FetchContent
        run: git config --global url."https://x-access-token:${INSTALL_TOKEN}@github.com/".insteadOf "https://github.com/"

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Configure CMake
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: ninja -C build

      - name: Test
        run: ctest --test-dir build --output-on-failure
