---
name: Build

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Ubuntu (Ninja)
            os: ubuntu-latest
            generator: Ninja
            build_flag: ""
            test_flag: ""
          - name: macOS (Ninja)
            os: macos-latest
            generator: Ninja
            build_flag: ""
            test_flag: ""
          - name: Windows (MSVC)
            os: windows-latest
            generator: Visual Studio 17 2022
            build_flag: "--config Release"
            test_flag: "-C Release"

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          submodules: false
          persist-credentials: false

      - name: Install Ninja (Ubuntu)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Install Ninja (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja

      - name: Configure CMake
        run: cmake -S . -B build -G "${{ matrix.generator }}" -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build ${{ matrix.build_flag }}

      - name: Test
        run: ctest --test-dir build --output-on-failure ${{ matrix.test_flag }}
